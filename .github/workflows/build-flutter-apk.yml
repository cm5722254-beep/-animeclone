name: Build Flutter APK

on:
  push:
    branches: [ main ]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk build_output/CheatzDabber_Flutter_v1.0.apk
          ls -lh build_output/

      - name: Upload Flutter APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheatzDabber_Flutter_v1.0.apk
          path: build_output/CheatzDabber_Flutter_v1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: flutter-v1.0
          name: "Cheatz Dabber Flutter Mobile App v1.0 (Khmer Neural APK)"
          body: |
            ### 📱 Cheatz Dabber - Flutter Edition (Android APK)
            - 🇰🇭 **Khmer Neural Only** (Piseth & Sreymom)
            - 📁 **Load Video** with native Android file picker
            - ✏️ **Editable Dialogue & Subtitles**
            - ⚡ **1-Tap Process & AI Dubbing**
            - 📥 **Export Dubbed Video**
          files: build_output/CheatzDabber_Flutter_v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
