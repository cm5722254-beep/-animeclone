name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build CheatzDabber APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          cd android
          rm -rf .gradle
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename and Prepare APK
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/CheatzDabber_Khmer_v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheatzDabber_Khmer_v1.0.apk
          path: build_output/CheatzDabber_Khmer_v1.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0-apk
          name: "Cheatz Dabber Android App v1.0 (Khmer Neural APK)"
          body: |
            ### 📱 Cheatz Dabber - Android APK (Khmer Neural Edition)
            - 🇰🇭 100% Khmer Natural Voices (Piseth & Sreymom)
            - 📁 Load Video direct from Android Gallery
            - ✏️ Live Editable Subtitles & Dialogue
            - ⚡ 1-Tap Process & Dubbing
            - 📥 1-Tap Direct Video Export
          files: build_output/CheatzDabber_Khmer_v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
